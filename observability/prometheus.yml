global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: claims-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: intake-agent
    static_configs:
      - targets: [intake-worker:9101]
  - job_name: coverage-agent
    static_configs:
      - targets: [coverage-worker:9102]
  - job_name: container-resources
    static_configs:
      - targets: [cadvisor:8080]
